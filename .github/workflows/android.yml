name: Проверка Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, тесты и Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Настроить JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Настроить Gradle и проверить Wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Собрать APK, выполнить модульные тесты и Lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Сохранить тестовый APK
        uses: actions/upload-artifact@v7
        with:
          name: mogu-skazat-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
